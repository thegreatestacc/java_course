spring.application.name=backend
server.port=8080

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/java_course_db
spring.datasource.username=java_course_user
spring.datasource.password=java_course_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JDBC Configuration
# Схема полностью управляется через Flyway
# JDBC используется для работы с базой данных

# Flyway Configuration
# Flyway автоматически применяет миграции при старте приложения
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# baseline-on-migrate: создает baseline для существующей базы данных (если таблица flyway_schema_history отсутствует)
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.baseline-description=Baseline for existing database
# validate-on-migrate: проверяет целостность миграций перед применением
spring.flyway.validate-on-migrate=true
# clean-disabled: отключает команду clean для безопасности
spring.flyway.clean-disabled=true
# Логирование для отладки миграций
logging.level.org.flywaydb=INFO

# Session Configuration
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m

# Cache Configuration (для dev-режима без Redis)
spring.cache.type=simple

# Admin Configuration
# Укажите email администратора для доступа к админке
app.admin.email=sovliv@yandex.ru