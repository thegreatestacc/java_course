spring.application.name=backend
server.port=8080

# PostgreSQL Configuration (для Docker - используем имя сервиса)
spring.datasource.url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:java_course_db}
spring.datasource.username=${POSTGRES_USER:java_course_user}
spring.datasource.password=${POSTGRES_PASSWORD:java_course_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
# Используем Liquibase для миграций, поэтому отключаем автоматическое обновление схемы
# Временно используем 'none' чтобы пропустить валидацию до применения миграций
# После применения миграций можно вернуть 'validate'
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Liquibase Configuration
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true
# Продолжать работу даже если миграции завершились с предупреждениями
spring.liquibase.drop-first=false
# Выполнять миграции до инициализации JPA
spring.liquibase.should-run=true

# Session Configuration
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax

# Connection Pool Configuration (HikariCP)
# Ограничиваем пул соединений для экономии ресурсов
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# JPA Performance Optimization
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Redis Configuration
spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=5
spring.data.redis.lettuce.pool.max-idle=3
spring.data.redis.lettuce.pool.min-idle=1
spring.data.redis.lettuce.pool.max-wait=1000ms

# Spring Cache Configuration (Redis)
spring.cache.type=redis
spring.cache.redis.time-to-live=300000
spring.cache.redis.cache-null-values=false
spring.cache.redis.key-prefix=cache:
spring.cache.redis.use-key-prefix=true

# Admin Configuration
# Укажите email администратора для доступа к админке
app.admin.email=sovliv@yandex.ru

