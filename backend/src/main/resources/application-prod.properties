spring.application.name=backend
server.port=8080

# PostgreSQL Configuration (для Docker - используем имя сервиса)
spring.datasource.url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:java_course_db}
spring.datasource.username=${POSTGRES_USER:java_course_user}
spring.datasource.password=${POSTGRES_PASSWORD:java_course_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JDBC Configuration
# Схема полностью управляется через Flyway
# JDBC используется для работы с базой данных

# Flyway Configuration
# Flyway автоматически применяет миграции при старте приложения
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# baseline-on-migrate: создает baseline для существующей базы данных (если таблица flyway_schema_history отсутствует)
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.baseline-description=Baseline for existing database
# validate-on-migrate: проверяет целостность миграций перед применением
spring.flyway.validate-on-migrate=true
# clean-disabled: отключает команду clean для безопасности на проде
spring.flyway.clean-disabled=true

# Session Configuration
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax

# Connection Pool Configuration (HikariCP)
# Ограничиваем пул соединений для экономии ресурсов
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# JDBC Connection Pool Optimization
# Настройки пула соединений управляются через HikariCP

# Redis Configuration
spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=5
spring.data.redis.lettuce.pool.max-idle=3
spring.data.redis.lettuce.pool.min-idle=1
spring.data.redis.lettuce.pool.max-wait=1000ms

# Spring Cache Configuration (Redis)
spring.cache.type=redis
spring.cache.redis.time-to-live=300000
spring.cache.redis.cache-null-values=false
spring.cache.redis.key-prefix=cache:
spring.cache.redis.use-key-prefix=true

# Admin Configuration
# Укажите email администратора для доступа к админке
app.admin.email=sovliv@yandex.ru

