spring.application.name=backend
server.port=8080

# PostgreSQL Configuration (для Docker - используем имя сервиса)
spring.datasource.url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:java_course_db}
spring.datasource.username=${POSTGRES_USER:java_course_user}
spring.datasource.password=${POSTGRES_PASSWORD:java_course_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Session Configuration
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax

