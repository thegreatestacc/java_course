spring.application.name=backend
server.port=8080

# PostgreSQL Configuration (для Docker - используем имя сервиса)
spring.datasource.url=jdbc:postgresql://postgres-dev:5432/${POSTGRES_DB_DEV:java_course_db_dev}
spring.datasource.username=${POSTGRES_USER_DEV:java_course_user_dev}
spring.datasource.password=${POSTGRES_PASSWORD_DEV:java_course_password_dev}
spring.datasource.driver-class-name=org.postgresql.Driver

# JDBC Configuration
# Схема полностью управляется через Flyway
# JDBC используется для работы с базой данных

# Flyway Configuration
# Flyway автоматически применяет миграции при старте приложения
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true

# Session Configuration
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax

# Connection Pool Configuration (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Redis Configuration
spring.data.redis.host=${SPRING_REDIS_HOST:redis-dev}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=10
spring.data.redis.lettuce.pool.max-idle=5
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-wait=1000ms

# Spring Cache Configuration (Redis)
spring.cache.type=redis
spring.cache.redis.time-to-live=300000
spring.cache.redis.cache-null-values=false
spring.cache.redis.key-prefix=cache:dev:
spring.cache.redis.use-key-prefix=true

# Admin Configuration
# Укажите ваш email для получения прав администратора в dev окружении
app.admin.email=sovliv@yandex.ru

# Dev specific settings
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE


