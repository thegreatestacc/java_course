services:
  postgres-dev:
    image: postgres:15-alpine
    container_name: java-course-postgres-dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB_DEV:-java_course_db_dev}
      POSTGRES_USER: ${POSTGRES_USER_DEV:-java_course_user_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_DEV:-java_course_password_dev}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER_DEV:-java_course_user_dev} -d ${POSTGRES_DB_DEV:-java_course_db_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - java-course-dev-network
    ports:
      - "5433:5432"  # Отдельный порт для dev БД
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  redis-dev:
    image: redis:7-alpine
    container_name: java-course-redis-dev
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - java-course-dev-network
    ports:
      - "6380:6379"  # Отдельный порт для dev Redis
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M

  backend-dev:
    image: ${REGISTRY:-ghcr.io}/${OWNER:-owner}/java-course-backend:${TAG:-dev}
    container_name: java-course-backend-dev
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-dev:5432/${POSTGRES_DB_DEV:-java_course_db_dev}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER_DEV:-java_course_user_dev}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD_DEV:-java_course_password_dev}
      SPRING_REDIS_HOST: redis-dev
      SPRING_REDIS_PORT: 6379
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
    ports:
      - "8081:8080"  # Отдельный порт для dev backend
    depends_on:
      postgres-dev:
        condition: service_healthy
      redis-dev:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - java-course-dev-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  nginx-dev:
    image: nginx:alpine
    container_name: java-course-nginx-dev
    ports:
      - "8080:80"  # Отдельный порт для dev nginx (HTTP)
      - "8443:443"  # Отдельный порт для dev nginx (HTTPS, если настроен)
    volumes:
      - ./nginx/nginx-dev.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/dev.conf:/etc/nginx/conf.d/default.conf:ro
      # Для dev можно использовать самоподписанные сертификаты или без HTTPS
    depends_on:
      - backend-dev
      - frontend-dev
    restart: unless-stopped
    networks:
      - java-course-dev-network
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M

  frontend-dev:
    image: ${REGISTRY:-ghcr.io}/${OWNER:-owner}/java-course-frontend:${TAG:-dev}
    container_name: java-course-frontend-dev
    depends_on:
      - backend-dev
    restart: unless-stopped
    networks:
      - java-course-dev-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.3'
          memory: 256M

volumes:
  postgres_data_dev:
    driver: local

networks:
  java-course-dev-network:
    driver: bridge



