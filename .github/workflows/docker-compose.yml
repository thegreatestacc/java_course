name: Build & Deploy (docker-compose)

on:
  push:
    branches: ["main"]

concurrency:
  group: deploy-main
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}
  TAG: ${{ github.sha }}

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR (push)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          no-cache: false
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/java-course-backend:latest
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/java-course-backend:${{ env.TAG }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/java-course-backend:latest

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          no-cache: false
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/java-course-frontend:latest
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/java-course-frontend:${{ env.TAG }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/java-course-frontend:latest

      - name: Build & push nginx
        uses: docker/build-push-action@v6
        with:
          context: ./nginx
          file: ./nginx/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/java-course-nginx:${{ env.TAG }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/java-course-nginx:latest

      - name: Test SSH connection
        uses: appleboy/ssh-action@v1.0.3
        id: ssh-test
        continue-on-error: true
        timeout-minutes: 1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          port: ${{ secrets.DEPLOY_PORT }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 10s
          script: |
            echo "✓ SSH connection test successful"
            echo "Hostname: $(hostname)"
            echo "Current directory: $(pwd)"
            echo "User: $(whoami)"
            echo "SSH port: ${{ secrets.DEPLOY_PORT }}"
            echo "Target path: ${{ secrets.DEPLOY_PATH }}"

      - name: Check SSH test result
        if: steps.ssh-test.outcome == 'failure'
        run: |
          echo "::error::SSH connection test failed!"
          echo "Please check:"
          echo "1. DEPLOY_HOST is correct and server is accessible"
          echo "2. DEPLOY_PORT is correct (default is 22)"
          echo "3. DEPLOY_USER has SSH access"
          echo "4. DEPLOY_SSH_KEY is correct and matches server's authorized_keys"
          echo "5. Firewall allows connections on SSH port"
          exit 1

      # --- Replace appleboy/scp-action with native scp/rsync (reliable) ---
      - name: Install SSH tools (scp/rsync)
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-client rsync

      - name: Configure SSH key and known_hosts
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Ensure deploy directories exist
        run: |
          set -euo pipefail
          ssh -p "${{ secrets.DEPLOY_PORT }}" -i ~/.ssh/id_rsa \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "mkdir -p '${{ secrets.DEPLOY_PATH }}/nginx'"

      - name: Copy docker-compose.prod.yml to server
        run: |
          set -euo pipefail
          scp -P "${{ secrets.DEPLOY_PORT }}" -i ~/.ssh/id_rsa \
            docker-compose.prod.yml \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/docker-compose.prod.yml"

      - name: Copy nginx directory to server
        run: |
          set -euo pipefail
          rsync -avz --delete -e "ssh -p ${{ secrets.DEPLOY_PORT }} -i ~/.ssh/id_rsa" \
            nginx/ \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/nginx/"

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        timeout-minutes: 10
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          port: ${{ secrets.DEPLOY_PORT }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"

            # Проверяем наличие docker-compose.prod.yml
            if [ ! -f docker-compose.prod.yml ]; then
              echo "ERROR: docker-compose.prod.yml not found!"
              echo "Please ensure the file exists in ${{ secrets.DEPLOY_PATH }}"
              exit 1
            fi
            echo "✓ docker-compose.prod.yml found"

            # Проверяем наличие nginx директории
            if [ ! -d nginx ]; then
              echo "WARNING: nginx directory not found, creating it..."
              mkdir -p nginx/conf.d
            fi

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

            # Очистка старых Docker образов перед деплоем
            echo "Cleaning up old Docker resources..."
            docker system prune -af --filter "until=24h" || true

            # Обновляем переменные окружения
            if [ -f .env ]; then
              sed -i "s/^TAG=.*/TAG=${{ env.TAG }}/" .env || echo "TAG=${{ env.TAG }}" >> .env
              grep -q '^REGISTRY=' .env || echo "REGISTRY=${{ env.REGISTRY }}" >> .env
              grep -q '^OWNER=' .env || echo "OWNER=${{ env.OWNER }}" >> .env
            else
              cat > .env << ENVEOF
            TAG=${{ env.TAG }}
            REGISTRY=${{ env.REGISTRY }}
            OWNER=${{ env.OWNER }}
            POSTGRES_DB=java_course_db
            POSTGRES_USER=java_course_user
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            ENVEOF
            fi

            # Скачиваем обновленные образы из GHCR (backend, frontend, nginx)
            echo "Pulling images from GHCR..."
            docker compose -f docker-compose.prod.yml pull backend frontend nginx || {
              echo "WARNING: Failed to pull some images from GHCR, continuing..."
            }
            
            # Пытаемся скачать базовые образы (postgres, redis) с обработкой ошибок лимита Docker Hub
            echo "Pulling base images (postgres, redis)..."
            docker compose -f docker-compose.prod.yml pull postgres redis 2>&1 || {
              echo "WARNING: Could not pull postgres/redis (possibly rate limit), using existing images"
            }

            # Перезапускаем контейнеры с принудительной пересборкой (использует существующие образы, если pull не удался)
            echo "Stopping existing containers..."
            docker compose -f docker-compose.prod.yml down
            
            echo "Starting containers with new images..."
            docker compose -f docker-compose.prod.yml up -d --remove-orphans --force-recreate
            
            echo "Cleaning up old/unused images..."
            docker image prune -f
