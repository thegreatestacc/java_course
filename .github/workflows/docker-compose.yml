name: Build & Deploy (docker-compose)

on:
  push:
    branches: ["main"]

concurrency:
  group: deploy-main
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}
  TAG: ${{ github.sha }}

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR (push)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/java-course-backend:${{ env.TAG }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/java-course-backend:latest

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/java-course-frontend:${{ env.TAG }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/java-course-frontend:latest

      - name: Build & push nginx
        uses: docker/build-push-action@v6
        with:
          context: ./nginx
          file: ./nginx/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/java-course-nginx:${{ env.TAG }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/java-course-nginx:latest

      - name: Copy docker-compose to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          port: ${{ secrets.DEPLOY_PORT }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "${{ secrets.DEPLOY_PATH }}"
          timeout: 180s
          command_timeout: 300s

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          port: ${{ secrets.DEPLOY_PORT }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            
            # Если docker-compose.prod.yml не скопировался через SCP, создадим его через SSH
            if [ ! -f docker-compose.prod.yml ]; then
              echo "docker-compose.prod.yml not found, will be created via git pull or manual copy"
            fi

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

            # Обновляем переменные окружения
            if [ -f .env ]; then
              if grep -q '^TAG=' .env; then
                sed -i "s/^TAG=.*/TAG=${{ env.TAG }}/" .env
              else
                echo "TAG=${{ env.TAG }}" >> .env
              fi
              
              if ! grep -q '^REGISTRY=' .env; then
                echo "REGISTRY=${{ env.REGISTRY }}" >> .env
              fi
              
              if ! grep -q '^OWNER=' .env; then
                echo "OWNER=${{ env.OWNER }}" >> .env
              fi
            else
              echo "TAG=${{ env.TAG }}" > .env
              echo "REGISTRY=${{ env.REGISTRY }}" >> .env
              echo "OWNER=${{ env.OWNER }}" >> .env
            fi

            # Скачиваем обновленные образы
            docker compose -f docker-compose.prod.yml pull backend frontend nginx
            
            # Перезапускаем контейнеры
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
