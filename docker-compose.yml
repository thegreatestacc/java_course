services:
  postgres:
    image: postgres:15-alpine
    container_name: java-course-postgres
    environment:
      POSTGRES_DB: java_course_db
      POSTGRES_USER: java_course_user
      POSTGRES_PASSWORD: java_course_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U java_course_user -d java_course_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

