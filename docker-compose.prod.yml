services:
  postgres:
    image: postgres:15-alpine
    container_name: java-course-postgres
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      TZ: Europe/Moscow
      POSTGRES_DB: ${POSTGRES_DB:-java_course_db}
      POSTGRES_USER: ${POSTGRES_USER:-java_course_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-java_course_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-java_course_user} -d ${POSTGRES_DB:-java_course_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - java-course-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  redis:
    image: redis:7-alpine
    container_name: java-course-redis
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    environment:
      TZ: Europe/Moscow
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - java-course-network
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M

  backend:
    image: ${REGISTRY:-ghcr.io}/${OWNER:-owner}/java-course-backend:${TAG:-latest}
    container_name: java-course-backend
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    environment:
      TZ: Europe/Moscow
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-java_course_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-java_course_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-java_course_password}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - java-course-network
    deploy:
      resources:
        limits:
          cpus: '0.7'
          memory: 768M
        reservations:
          cpus: '0.3'
          memory: 384M

  nginx:
    image: ${REGISTRY:-ghcr.io}/${OWNER:-owner}/java-course-nginx:${TAG:-latest}
    container_name: java-course-nginx
    logging:
      driver: "json-file"
      options:
        max-size: "15m"
        max-file: "3"
    environment:
      TZ: Europe/Moscow
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt/live/devcours.ru-0001/fullchain.pem:/etc/nginx/ssl/fullchain.pem:ro
      - /etc/letsencrypt/live/devcours.ru-0001/privkey.pem:/etc/nginx/ssl/privkey.pem:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - java-course-network
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M

  frontend:
    image: ${REGISTRY:-ghcr.io}/${OWNER:-owner}/java-course-frontend:${TAG:-latest}
    container_name: java-course-frontend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      TZ: Europe/Moscow
    # Не экспортируем порты напрямую, используем Nginx
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - java-course-network
    deploy:
      resources:
        limits:
          cpus: '0.4'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 256M

volumes:
  postgres_data:
    driver: local

networks:
  java-course-network:
    driver: bridge
